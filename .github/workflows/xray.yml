name: xray-serveo-tunnel
on:
  workflow_dispatch: {}

jobs:
  run-xray:
    name: Run Xray + serveo tunnel
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository (workspace)
        uses: actions/checkout@v4

      - name: Prepare and run Xray + serveo tunnel
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # --- Helper / cleanup ------------------------------------------------
          cleanup() {
            rc=$?
            echo "=== CLEANUP START (exit code: $rc) ==="
            if [ -n "${SSH_PID-}" ] && ps -p "$SSH_PID" > /dev/null 2>&1; then
              echo "Killing serveo ssh (pid $SSH_PID)..."
              kill "$SSH_PID" || true
              wait "$SSH_PID" 2>/dev/null || true
            fi
            if docker ps -a --format '{{.Names}}' | grep -q '^xray$'; then
              echo "Stopping docker container 'xray'..."
              docker rm -f xray || true
            fi
            echo "=== CLEANUP END ==="
            exit $rc
          }
          trap cleanup INT TERM EXIT

          # --- Environment -----------------------------------------------------
          WORKDIR="${GITHUB_WORKSPACE:-$(pwd)}"
          cd "$WORKDIR"
          echo "Working directory: $WORKDIR"

          # --- UUID generation -------------------------------------------------
          if command -v uuidgen >/dev/null 2>&1; then
            UUID="$(uuidgen)"
          else
            UUID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          fi
          echo "Generated UUID: $UUID"

          # --- Create xray config (FIXED: removed "encryption" field) ---------
          XRAY_CONFIG_PATH="${WORKDIR}/xray.json"
          cat > "$XRAY_CONFIG_PATH" <<JSON
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "${UUID}",
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/vless"
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {}
              }
            ]
          }
          JSON
          echo "Wrote xray config to $XRAY_CONFIG_PATH"

          # --- Run Xray container ----------------------------------------------
          if docker ps -a --format '{{.Names}}' | grep -q '^xray$'; then
            echo "Removing existing container 'xray'..."
            docker rm -f xray || true
          fi

          echo "Starting xray container..."
          docker run -d --name xray -p 8080:8080 -v "${XRAY_CONFIG_PATH}":/etc/xray/config.json teddysun/xray
          sleep 2
          echo "Docker container started:"
          docker ps --filter "name=xray" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          if ! docker ps --format '{{.Names}}' | grep -q '^xray$'; then
            echo "ERROR: docker container 'xray' is not running."
            docker logs xray || true
            exit 1
          fi

          # --- Serveo tunnel with retries -------------------------------------
          SERVEO_LOG="${WORKDIR}/serveo.log"
          ATTEMPT=0
          MAX_ATTEMPTS=3
          BACKOFF=(0 5 15 60)

          DOMAIN=""
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "Attempt #${ATTEMPT} to start serveo tunnel..."

            rm -f "$SERVEO_LOG"
            touch "$SERVEO_LOG"

            ( ssh -R 443:localhost:8080 serveo.net -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=60 -o StrictHostKeyChecking=no >"$SERVEO_LOG" 2>&1 ) &
            SSH_PID=$!
            echo "serveo ssh started (pid $SSH_PID), waiting for forwarding info..."

            FOUND=0
            for i in $(seq 1 30); do
              if grep -Eo 'https?://[a-zA-Z0-9.-]+serveo.net' "$SERVEO_LOG" 2>/dev/null | head -n1 >/dev/null; then
                DOMAIN="$(grep -Eo 'https?://[a-zA-Z0-9.-]+serveo.net' "$SERVEO_LOG" | head -n1 | sed -E 's#https?://##; s#/$##')"
                FOUND=1
                break
              fi
              if grep -i 'forwarding' "$SERVEO_LOG" 2>/dev/null | grep -Eo '[a-zA-Z0-9.-]+serveo.net' | head -n1 >/dev/null; then
                DOMAIN="$(grep -i 'forwarding' "$SERVEO_LOG" | grep -Eo '[a-zA-Z0-9.-]+serveo.net' | head -n1)"
                FOUND=1
                break
              fi
              sleep 1
            done

            if [ "$FOUND" -eq 1 ] && [ -n "${DOMAIN}" ]; then
              echo "Serveo published domain: $DOMAIN"
              DOMAIN="$(echo "$DOMAIN" | sed -E 's#/$##')"
              break
            fi

            echo "Serveo did not provide a domain within timeout. Collecting logs:"
            echo "----- serveo.log (partial) -----"
            tail -n +1 "$SERVEO_LOG" || true
            echo "----- end serveo.log -----"

            if ps -p "$SSH_PID" > /dev/null 2>&1; then
              echo "Killing serveo ssh (pid $SSH_PID) before retry..."
              kill "$SSH_PID" || true
              wait "$SSH_PID" 2>/dev/null || true
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              WAIT=${BACKOFF[$ATTEMPT]}
              echo "Retrying in ${WAIT}s..."
              sleep "$WAIT"
            fi
          done

          if [ -z "${DOMAIN}" ]; then
            echo "ERROR: serveo tunnel failed after ${MAX_ATTEMPTS} attempts."
            echo "Final serveo.log:"
            cat "$SERVEO_LOG" || true
            exit 2
          fi

          # --- Final verification & VLESS link output -------------------------
          echo "Verifying xray process inside container (docker logs tail):"
          docker logs xray --tail 100 || true

          VLESS="vless://${UUID}@${DOMAIN}:443?encryption=none&flow=xtls-rprx-vision&security=tls&sni=${DOMAIN}&type=ws&path=%2Fvless"
          echo "================================================================"
          echo "VLESS link (copy this):"
          echo "$VLESS"
          echo "================================================================"

          echo "Service will remain active for 6 hours (sleep 6h). To cancel, stop the workflow."
          sleep 6h

          echo "Completed 6h uptime period; exiting."
        shell: bash
