name: xray-vless
on:
  workflow_dispatch: {}

jobs:
  run-xray:
    name: Run Xray
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository (workspace)
        uses: actions/checkout@v4

      - name: Run Xray and output VLESS link
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # --- Helper / cleanup ------------------------------------------------
          cleanup() {
            rc=$?
            echo "=== CLEANUP START (exit code: $rc) ==="
            if docker ps -a --format '{{.Names}}' | grep -q '^xray$'; then
              echo "Stopping docker container 'xray'..."
              docker rm -f xray || true
            fi
            echo "=== CLEANUP END ==="
            exit $rc
          }
          trap cleanup INT TERM EXIT

          # --- Environment -----------------------------------------------------
          WORKDIR="${GITHUB_WORKSPACE:-$(pwd)}"
          cd "$WORKDIR"
          echo "Working directory: $WORKDIR"

          # --- UUID generation -------------------------------------------------
          if command -v uuidgen >/dev/null 2>&1; then
            UUID="$(uuidgen)"
          else
            UUID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          fi
          echo "Generated UUID: $UUID"

          # --- Create xray config -----------------------------------------------
          XRAY_CONFIG_PATH="${WORKDIR}/xray.json"
          cat > "$XRAY_CONFIG_PATH" <<JSON
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "${UUID}",
                      "flow": "xtls-rprx-vision"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/vless"
                    }
                  }
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {}
              }
            ]
          }
          JSON
          echo "Wrote xray config to $XRAY_CONFIG_PATH"

          # --- Run Xray container ----------------------------------------------
          if docker ps -a --format '{{.Names}}' | grep -q '^xray$'; then
            echo "Removing existing container 'xray'..."
            docker rm -f xray || true
          fi

          echo "Starting xray container..."
          docker run -d --name xray -p 8080:8080 -v "${XRAY_CONFIG_PATH}":/etc/xray/config.json teddysun/xray
          sleep 2
          echo "Docker container started:"
          docker ps --filter "name=xray" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          if ! docker ps --format '{{.Names}}' | grep -q '^xray$'; then
            echo "ERROR: docker container 'xray' is not running."
            docker logs xray || true
            exit 1
          fi

          # --- Verify xray is responding ----------------------------------------
          echo "Verifying xray container logs:"
          docker logs xray --tail 20 || true

          # --- Get runner's IP address ------------------------------------------
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "Runner IP: $RUNNER_IP"

          # --- Output VLESS link for local access -------------------------------
          VLESS="vless://${UUID}@${RUNNER_IP}:8080?encryption=none&flow=xtls-rprx-vision&security=none&type=ws&path=%2Fvless"
          echo "================================================================"
          echo "VLESS link (local access via runner IP):"
          echo "$VLESS"
          echo "================================================================"
          echo "UUID: $UUID"
          echo "Access via: ${RUNNER_IP}:8080"
          echo "WebSocket path: /vless"
          echo "================================================================"

          echo "Service will remain active for 6 hours (sleep 6h). To cancel, stop the workflow."
          sleep 6h

          echo "Completed 6h uptime period; exiting."
        shell: bash
